<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070b10" />
  <title>Winter Fox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./winter-ui.css?v=20260925-9" />
  <style>
    html, body, #app {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      overflow: hidden;
      background: #05070b !important;
    }
    #app.is-title {
      background: #05070b !important;
    }
    #app.is-title #game {
      display: none !important;
    }
    #title-screen {
      background: #05070b !important;
    }
  </style>
</head>
<body>
  <main id="app" class="is-title">
    <div id="game" style="display:none;background:#05070b" aria-label="Winter Fox"></div>

    <div class="screen-vignette" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <section id="title-screen" class="title-screen">
      <div id="title-snow" class="title-snow" aria-hidden="true"></div>
      <div class="title-minimal">
        <div class="fox-mark" aria-hidden="true">
          <span class="fox-ear fox-ear-left"></span>
          <span class="fox-face"></span>
          <span class="fox-ear fox-ear-right"></span>
        </div>

        <h1>WINTER FOX</h1>

        <button id="start-button" class="start-minimal" type="button">
          <span>Começar</span>
          <span class="start-line" aria-hidden="true"></span>
        </button>
      </div>
    </section>

    <header id="hud" class="hud hidden">
      <div class="hud-section">
        <span class="hud-kicker">LOCAL</span>
        <strong id="area-name">Floresta de Inverno</strong>
      </div>
      <div class="hud-divider"></div>
      <div class="hud-section hud-objective">
        <span class="hud-kicker">OBJETIVO</span>
        <strong id="objective-text">Encontre a raposa</strong>
      </div>
    </header>

    <div id="interaction" class="interaction hidden">
      <kbd>E</kbd>
      <span id="interaction-text">Interagir</span>
    </div>

    <section id="dialogue" class="dialogue hidden" aria-live="polite">
      <div class="dialogue-accent"></div>
      <div class="dialogue-content">
        <div id="dialogue-speaker" class="dialogue-speaker">RAPOSA</div>
        <p id="dialogue-text"></p>
      </div>
      <div class="dialogue-next"><kbd>E</kbd><span>continuar</span></div>
    </section>

    <div id="controls" class="controls hidden">
      <span><kbd>WASD</kbd> mover</span>
      <i></i>
      <span><kbd>E</kbd> interagir</span>
    </div>

    <div id="loading" class="loading">
      <span class="loading-mark">✦</span>
      <span>Preparando o inverno…</span>
    </div>

    <noscript>Você precisa ativar o JavaScript para jogar Winter Fox.</noscript>
  </main>

  <script>
    (function createTitleSnow() {
      const snow = document.getElementById("title-snow");
      if (!snow) return;

      const flakes = [];
      const count = 92;
      let last = performance.now();

      function randomize(flake, firstSpawn) {
        const sizeRoll = Math.random();

        flake.size =
          sizeRoll < 0.58 ? (Math.random() * 1.4 + 1.0) :
          sizeRoll < 0.90 ? (Math.random() * 1.9 + 1.8) :
                            (Math.random() * 2.3 + 3.0);

        flake.x = Math.random() * window.innerWidth;
        flake.y = firstSpawn
          ? Math.random() * window.innerHeight
          : -(Math.random() * 90 + 12);

        // Every respawn gets a new fall behaviour.
        flake.speed = Math.random() * 34 + 28;
        flake.wind = Math.random() * 18 - 9;
        flake.wobble = Math.random() * 15 + 3;
        flake.frequency = Math.random() * 0.0018 + 0.0007;
        flake.phase = Math.random() * Math.PI * 2;
        flake.opacity = Math.random() * 0.46 + 0.26;
        flake.soft = Math.random() < 0.22;

        const el = flake.el;
        el.style.width = flake.size + "px";
        el.style.height = flake.size + "px";
        el.style.opacity = flake.opacity;
        el.classList.toggle("soft-flake", flake.soft);
      }

      for (let i = 0; i < count; i++) {
        const el = document.createElement("span");
        el.className = "title-flake";
        snow.appendChild(el);

        const flake = { el };
        randomize(flake, true);
        flakes.push(flake);
      }

      function frame(now) {
        const dt = Math.min((now - last) / 1000, 0.035);
        last = now;

        for (const flake of flakes) {
          flake.y += flake.speed * dt;
          flake.x += flake.wind * dt;

          const sway =
            Math.sin(now * flake.frequency + flake.phase) *
            flake.wobble;

          flake.el.style.transform =
            "translate3d(" +
            (flake.x + sway).toFixed(1) + "px," +
            flake.y.toFixed(1) + "px,0)";

          if (
            flake.y > window.innerHeight + 20 ||
            flake.x < -80 ||
            flake.x > window.innerWidth + 80
          ) {
            randomize(flake, false);
          }
        }

        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script src="./winter-game.js?v=5"></script>
</body>
</html>
