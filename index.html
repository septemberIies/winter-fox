<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070b10" />
  <title>Winter Fox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css?v=20260925-4" />
  <style>
    /* critical-title-shell */
    html, body, #app {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      overflow: hidden;
      background: #05070b !important;
    }

    #app.is-title #game {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
    }

    #app.is-title .title-screen {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100dvh !important;
      z-index: 9999 !important;
      display: grid !important;
      place-items: center !important;
      background: #05070b !important;
    }

    #app.is-title .title-minimal {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    #app.is-title .title-minimal h1 {
      margin: 0;
      color: #f5f7f9;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(64px, 8.4vw, 128px);
      line-height: .9;
      font-weight: 600;
      letter-spacing: .145em;
      white-space: nowrap;
    }

    #app.is-title .start-minimal {
      appearance: none;
      -webkit-appearance: none;
      margin-top: 42px;
      padding: 12px 8px 15px;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: #c9d1d9;
      cursor: pointer;
      font-family: "Manrope", sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .31em;
      text-transform: uppercase;
    }

    #app.is-title .start-line {
      display: block;
      width: 34px;
      height: 1px;
      margin: 11px auto 0;
      background: rgba(218, 227, 235, .32);
    }
  </style>
</head>
<body>
  <main id="app" class="is-title">
    <div id="game" aria-label="Winter Fox"></div>

    <div class="screen-vignette" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <section id="title-screen" class="title-screen">
      <div class="title-minimal">
        <div class="fox-mark" aria-hidden="true">
          <span class="fox-ear fox-ear-left"></span>
          <span class="fox-face"></span>
          <span class="fox-ear fox-ear-right"></span>
        </div>

        <h1>WINTER FOX</h1>

        <button id="start-button" class="start-minimal" type="button">
          <span>Começar</span>
          <span class="start-line" aria-hidden="true"></span>
        </button>
      </div>
    </section>

    <header id="hud" class="hud hidden">
      <div class="hud-section">
        <span class="hud-kicker">LOCAL</span>
        <strong id="area-name">Floresta de Inverno</strong>
      </div>
      <div class="hud-divider"></div>
      <div class="hud-section hud-objective">
        <span class="hud-kicker">OBJETIVO</span>
        <strong id="objective-text">Encontre a raposa</strong>
      </div>
    </header>

    <div id="interaction" class="interaction hidden">
      <kbd>E</kbd>
      <span id="interaction-text">Interagir</span>
    </div>

    <section id="dialogue" class="dialogue hidden" aria-live="polite">
      <div class="dialogue-accent"></div>
      <div class="dialogue-content">
        <div id="dialogue-speaker" class="dialogue-speaker">RAPOSA</div>
        <p id="dialogue-text"></p>
      </div>
      <div class="dialogue-next"><kbd>E</kbd><span>continuar</span></div>
    </section>

    <div id="controls" class="controls hidden">
      <span><kbd>WASD</kbd> mover</span>
      <i></i>
      <span><kbd>E</kbd> interagir</span>
    </div>

    <div id="loading" class="loading">
      <span class="loading-mark">✦</span>
      <span>Preparando o inverno…</span>
    </div>

    <noscript>Você precisa ativar o JavaScript para jogar Winter Fox.</noscript>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script src="./game.js?v=20260925-4"></script>
</body>
</html>
