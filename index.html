<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070b10" />
  <title>Winter Fox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./winter-ui.css?v=20260925-10" />
  <style>
    html, body, #app {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      overflow: hidden;
      background: #05070b !important;
    }
    #app.is-title {
      background: #05070b !important;
    }
    #app.is-title #game {
      display: none !important;
    }
    #title-screen {
      background: #05070b !important;
    }
  </style>
</head>
<body>
  <main id="app" class="is-title">
    <div id="game" style="display:none;background:#05070b" aria-label="Winter Fox"></div>

    <div class="screen-vignette" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <section id="title-screen" class="title-screen">
      <div id="title-snow" class="title-snow" aria-hidden="true"></div>
      <div class="title-minimal">
        <div class="fox-mark" aria-hidden="true">
          <span class="fox-ear fox-ear-left"></span>
          <span class="fox-face"></span>
          <span class="fox-ear fox-ear-right"></span>
        </div>

        <h1>WINTER FOX</h1>

        <button id="start-button" class="start-minimal" type="button">
          <span>Começar</span>
          <span class="start-line" aria-hidden="true"></span>
        </button>
      </div>
    </section>

    <header id="hud" class="hud hidden">
      <div class="hud-section">
        <span class="hud-kicker">LOCAL</span>
        <strong id="area-name">Floresta de Inverno</strong>
      </div>
      <div class="hud-divider"></div>
      <div class="hud-section hud-objective">
        <span class="hud-kicker">OBJETIVO</span>
        <strong id="objective-text">Encontre a raposa</strong>
      </div>
    </header>

    <div id="interaction" class="interaction hidden">
      <kbd>E</kbd>
      <span id="interaction-text">Interagir</span>
    </div>

    <section id="dialogue" class="dialogue hidden" aria-live="polite">
      <div class="dialogue-accent"></div>
      <div class="dialogue-content">
        <div id="dialogue-speaker" class="dialogue-speaker">RAPOSA</div>
        <p id="dialogue-text"></p>
      </div>
      <div class="dialogue-next"><kbd>E</kbd><span>continuar</span></div>
    </section>

    <div id="controls" class="controls hidden">
      <span><kbd>WASD</kbd> mover</span>
      <i></i>
      <span><kbd>E</kbd> interagir</span>
    </div>

    <div id="loading" class="loading">
      <span class="loading-mark">✦</span>
      <span>Preparando o inverno…</span>
    </div>

    <noscript>Você precisa ativar o JavaScript para jogar Winter Fox.</noscript>
  </main>

  <script>
    (function createTitleSnow() {
      const snow = document.getElementById("title-snow");
      if (!snow) return;

      const flakes = [];
      const count = 92;
      let last = performance.now();

      function randomize(flake, firstSpawn) {
        const sizeRoll = Math.random();

        flake.size =
          sizeRoll < 0.58 ? (Math.random() * 1.4 + 1.0) :
          sizeRoll < 0.90 ? (Math.random() * 1.9 + 1.8) :
                            (Math.random() * 2.3 + 3.0);

        flake.x = Math.random() * window.innerWidth;
        flake.y = firstSpawn
          ? Math.random() * window.innerHeight
          : -(Math.random() * 90 + 12);

        // Every respawn gets a new fall behaviour.
        flake.speed = Math.random() * 34 + 28;
        flake.wind = Math.random() * 18 - 9;
        flake.wobble = Math.random() * 15 + 3;
        flake.frequency = Math.random() * 0.0018 + 0.0007;
        flake.phase = Math.random() * Math.PI * 2;
        flake.opacity = Math.random() * 0.46 + 0.26;
        flake.soft = Math.random() < 0.22;

        const el = flake.el;
        el.style.width = flake.size + "px";
        el.style.height = flake.size + "px";
        el.style.opacity = flake.opacity;
        el.classList.toggle("soft-flake", flake.soft);
      }

      for (let i = 0; i < count; i++) {
        const el = document.createElement("span");
        el.className = "title-flake";
        snow.appendChild(el);

        const flake = { el };
        randomize(flake, true);
        flakes.push(flake);
      }

      function frame(now) {
        const dt = Math.min((now - last) / 1000, 0.035);
        last = now;

        for (const flake of flakes) {
          flake.y += flake.speed * dt;
          flake.x += flake.wind * dt;

          const sway =
            Math.sin(now * flake.frequency + flake.phase) *
            flake.wobble;

          flake.el.style.transform =
            "translate3d(" +
            (flake.x + sway).toFixed(1) + "px," +
            flake.y.toFixed(1) + "px,0)";

          if (
            flake.y > window.innerHeight + 20 ||
            flake.x < -80 ||
            flake.x > window.innerWidth + 80
          ) {
            randomize(flake, false);
          }
        }

        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    })();
  </script>

  <script>
    window.WinterAudio = (function () {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      let ctx = null;
      let master = null;
      let windSource = null;
      let windGain = null;

      function ensure() {
        if (!AudioCtx) return null;

        if (!ctx) {
          ctx = new AudioCtx();
          master = ctx.createGain();
          master.gain.value = 0.72;
          master.connect(ctx.destination);
        }

        if (ctx.state === "suspended") {
          ctx.resume().catch(() => {});
        }

        return ctx;
      }

      function tone({
        frequency = 440,
        endFrequency = frequency,
        duration = 0.08,
        volume = 0.03,
        type = "sine",
        delay = 0
      } = {}) {
        const audio = ensure();
        if (!audio) return;

        const now = audio.currentTime + delay;
        const osc = audio.createOscillator();
        const gain = audio.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(frequency, now);
        osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFrequency), now + duration);

        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(volume, now + Math.min(0.012, duration * 0.25));
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        osc.connect(gain);
        gain.connect(master);
        osc.start(now);
        osc.stop(now + duration + 0.02);
      }

      function noiseBurst(duration = 0.045, volume = 0.014, cutoff = 1100) {
        const audio = ensure();
        if (!audio) return;

        const length = Math.max(1, Math.floor(audio.sampleRate * duration));
        const buffer = audio.createBuffer(1, length, audio.sampleRate);
        const data = buffer.getChannelData(0);

        for (let i = 0; i < length; i++) {
          data[i] = (Math.random() * 2 - 1) * (1 - i / length);
        }

        const source = audio.createBufferSource();
        const filter = audio.createBiquadFilter();
        const gain = audio.createGain();

        source.buffer = buffer;
        filter.type = "lowpass";
        filter.frequency.value = cutoff;

        const now = audio.currentTime;
        gain.gain.setValueAtTime(volume, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        source.connect(filter);
        filter.connect(gain);
        gain.connect(master);
        source.start(now);
      }

      function play(name) {
        switch (name) {
          case "hover":
            tone({ frequency: 720, endFrequency: 840, duration: 0.045, volume: 0.012, type: "triangle" });
            break;

          case "click":
            noiseBurst(0.038, 0.018, 900);
            tone({ frequency: 185, endFrequency: 150, duration: 0.055, volume: 0.022, type: "triangle" });
            break;

          case "start":
            noiseBurst(0.055, 0.012, 1250);
            tone({ frequency: 330, endFrequency: 390, duration: 0.13, volume: 0.025, type: "sine" });
            tone({ frequency: 494, endFrequency: 587, duration: 0.18, volume: 0.020, type: "sine", delay: 0.055 });
            break;

          case "interact":
            tone({ frequency: 275, endFrequency: 345, duration: 0.065, volume: 0.018, type: "triangle" });
            break;

          case "dialogue":
            tone({ frequency: 510, endFrequency: 470, duration: 0.035, volume: 0.010, type: "triangle" });
            break;

          case "rune":
            tone({ frequency: 622, endFrequency: 698, duration: 0.22, volume: 0.025, type: "sine" });
            tone({ frequency: 932, endFrequency: 1046, duration: 0.30, volume: 0.017, type: "sine", delay: 0.07 });
            break;

          case "step": {
            const pitch = 118 + Math.random() * 34;
            noiseBurst(0.055, 0.010 + Math.random() * 0.006, 620 + Math.random() * 240);
            tone({
              frequency: pitch,
              endFrequency: pitch * 0.78,
              duration: 0.045,
              volume: 0.010,
              type: "triangle"
            });
            break;
          }

          case "fox":
            tone({ frequency: 520, endFrequency: 650, duration: 0.08, volume: 0.015, type: "triangle" });
            tone({ frequency: 760, endFrequency: 690, duration: 0.10, volume: 0.011, type: "sine", delay: 0.045 });
            break;
        }
      }

      function startWind() {
        const audio = ensure();
        if (!audio || windSource) return;

        const seconds = 3;
        const buffer = audio.createBuffer(1, audio.sampleRate * seconds, audio.sampleRate);
        const data = buffer.getChannelData(0);

        let smooth = 0;
        for (let i = 0; i < data.length; i++) {
          const white = Math.random() * 2 - 1;
          smooth = smooth * 0.985 + white * 0.015;
          data[i] = smooth * 3.1;
        }

        windSource = audio.createBufferSource();
        const filter = audio.createBiquadFilter();
        windGain = audio.createGain();

        windSource.buffer = buffer;
        windSource.loop = true;

        filter.type = "bandpass";
        filter.frequency.value = 420;
        filter.Q.value = 0.45;

        windGain.gain.value = 0.018;

        windSource.connect(filter);
        filter.connect(windGain);
        windGain.connect(master);
        windSource.start();
      }

      return { ensure, play, startWind };
    })();

    (function bindUISounds() {
      document.addEventListener("mouseover", (event) => {
        const button = event.target.closest && event.target.closest("button");
        if (!button) return;
        if (event.relatedTarget && button.contains(event.relatedTarget)) return;
        window.WinterAudio.play("hover");
      });

      document.addEventListener("pointerdown", (event) => {
        const button = event.target.closest && event.target.closest("button");
        if (!button) return;

        if (button.id === "start-button") {
          window.WinterAudio.play("start");
        } else {
          window.WinterAudio.play("click");
        }
      });
    })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script src="./winter-game.js?v=20260925-12"></script>
</body>
</html>
